name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    defaults:
      run:
        working-directory: xiaozhi-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
        # libopus.so is prebuilt/committed, but AGP's externalNativeBuild
        # requires NDK + CMake to be present to configure the JNI wrapper.

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/xiaozhi-release2.keystore"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/xiaozhi-release2.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build signed release APK
        if: env.KEYSTORE_PASSWORD != ''
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: xiaozhi-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.KEYSTORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: xiaozhi-android/app/build/outputs/apk/release/app-release.apk