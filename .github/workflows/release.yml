name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: xiaozhi
    defaults:
      run:
        working-directory: xiaozhi-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot sign the release APK. Refusing to release an unsigned APK."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/xiaozhi-release2.keystore"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/xiaozhi-release2.keystore" >> "$GITHUB_ENV"

      - name: Check signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              echo "::error::$v secret is not set — cannot sign the release APK. Refusing to release an unsigned APK."
              exit 1
            fi
          done

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
        # libopus.so is prebuilt/committed, but AGP's externalNativeBuild
        # requires NDK + CMake to be present to configure the JNI wrapper.

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner not found — cannot verify the APK. Release aborted."
            exit 1
          fi
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk \
            || { echo "::error::APK signature verification FAILED — releasing an invalid APK is not allowed."; exit 1; }

      - name: Copy APK to release name
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/xiaozhi-android.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: xiaozhi-android.apk
          generate_release_notes: true