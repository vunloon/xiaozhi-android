name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiaozhi-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — releasing an UNSIGNED APK"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/xiaozhi-release.keystore"
          fi

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
        # libopus.so is prebuilt/committed, but AGP's externalNativeBuild
        # requires NDK + CMake to be present to configure the JNI wrapper.

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/xiaozhi-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Copy APK to release name
        run: |
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/xiaozhi-android.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/xiaozhi-android.apk"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: xiaozhi-android.apk
          generate_release_notes: true